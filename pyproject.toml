[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aioeltako_ip"]

[project]
name = "aioeltako-ip"
version = "0.2.1b1"
description = "Async Python client for Eltako Series 62/64 IP devices"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Mathis Müller", email = "hello@mathismueller.eu" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "homeassistant==2026.11.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pyyaml>=6.0.3",
    "ty>=0.0.99",
]

[tool.uv]
environments = ["python_full_version >= '3.14.2'"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
