<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eltako Automation Studio (dev)</title>
<style>
  /* HA-like tokens, light + dark. No external fonts/assets. */
  :root {
    --card-background-color: #fff;
    --primary-color: #03a9f4;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --divider-color: #e0e0e0;
    --error-color: #db4437;
    --success-color: #43a047;
    --ha-card-border-radius: 12px;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card-background-color: #1c1c1c;
      --primary-text-color: #e1e1e1;
      --secondary-text-color: #9e9e9e;
      --divider-color: #2c2c2c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--card-background-color); color: var(--primary-text-color);
  }
  header {
    display: flex; gap: 12px; align-items: center; padding: 16px 20px;
    border-bottom: 1px solid var(--divider-color); position: sticky; top: 0;
    background: var(--card-background-color); z-index: 5; flex-wrap: wrap;
  }
  header h1 { font-size: 17px; margin: 0; }
  .badge {
    font-size: 12px; padding: 2px 10px; border-radius: 20px;
    border: 1px solid var(--divider-color); color: var(--secondary-text-color);
  }
  .badge.live { color: var(--success-color); border-color: var(--success-color); }
  .spacer { flex: 1; }
  button, select, input {
    font: inherit; color: inherit;
  }
  button {
    border: 1px solid var(--divider-color); background: transparent;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button.primary { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }
  button.danger { color: var(--error-color); border-color: var(--error-color); }
  header select {
    background: transparent; border: 1px solid var(--divider-color);
    border-radius: 8px; padding: 7px 10px;
  }
  main { max-width: 980px; margin: 0 auto; padding: 20px; display: grid; gap: 12px; }
  #list { display: grid; gap: 12px; }
  .card {
    border: 1px solid var(--divider-color); border-radius: var(--ha-card-border-radius);
    padding: 14px 16px; display: grid; gap: 10px;
  }
  .flow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill {
    font-size: 12px; border: 1px solid var(--divider-color); border-radius: 20px;
    padding: 3px 10px; color: var(--secondary-text-color);
  }
  .pill.logic { color: var(--primary-color); border-color: var(--primary-color); }
  .pill.warn { color: #b7791f; border-color: #b7791f; }
  .arrow { color: var(--secondary-text-color); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .meta { font-size: 12px; color: var(--secondary-text-color); }
  dialog {
    border: 1px solid var(--divider-color); border-radius: 12px;
    background: var(--card-background-color); color: inherit;
    width: min(560px,  calc(100vw - 40px));
  }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { display: grid; gap: 10px; padding: 6px 0; }
  label { display: grid; gap: 4px; font-size: 13px; }
  select, input[type=text], input[type=number] {
    background: transparent; border: 1px solid var(--divider-color);
    border-radius: 8px; padding: 8px 10px;
  }
  .hint { font-size: 12px; color: var(--secondary-text-color); }
  #tmplList button { text-align: left; display: grid; gap: 2px; padding: 10px 12px; }
  #tmplList button strong { font-size: 14px; }
  #tmplList button small { font-size: 12px; color: var(--secondary-text-color); }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .check small { flex-basis: 100%; }
  .err { color: var(--error-color); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <h1>Eltako Automation Studio</h1>
  <span id="mode" class="badge">mock</span>
  <span id="count" class="badge">0 rules</span>
  <span class="spacer"></span>
  <select id="lang" aria-label="Language / Sprache">
    <option value="en">EN</option>
    <option value="de">DE</option>
  </select>
  <button id="new" data-i18n="new">New rule</button>
  <button id="reset" class="danger" data-i18n="reset">Reset</button>
</header>
<main>
  <div id="list"></div>
</main>
<p class="meta" style="max-width:980px;margin:0 auto;padding:0 20px 30px">
  <span data-i18n="footer"></span>
  Run <code>python3 studio/server.py</code> (mock) or with <code>--live</code> (gateway proxy).
</p>

<dialog id="picker">
  <h3 id="pickerTitle" style="margin:0 0 8px" data-i18n="pickerTitle">Choose a template</h3>
  <div id="tmplList" style="display:grid;gap:8px"></div>
  <div class="row" style="margin-top:12px">
    <span class="spacer"></span>
    <button value="cancel" data-i18n="cancel">Cancel</button>
  </div>
</dialog>

<dialog id="editor">
  <h3 id="editorTitle" style="margin:0 0 8px">Rule</h3>
  <form method="dialog" id="form">
    <label><span data-i18n="fInput">Input device</span><select id="fInput" required></select></label>
    <label><span data-i18n="fInputChar">Input characteristic</span>
      <select id="fInputChar"></select>
      <small class="hint" data-i18n="hintInputChar"></small>
    </label>
    <label><span data-i18n="fOutput">Output actuator</span><select id="fOutput" required></select></label>
    <label><span data-i18n="fOutputChar">Output characteristic</span>
      <select id="fOutputChar"></select>
    </label>
    <label><span data-i18n="fLogic">Logic</span>
      <select id="fLogic"></select>
      <small class="hint" data-i18n="hintLogic"></small>
    </label>
    <label id="rOff"><span data-i18n="fOff">Off-timer (s, 0 = off)</span><input id="fOff" type="number" min="0" step="1" value="10" />
      <small class="hint" data-i18n="hintOff"></small></label>
    <label id="rLong"><span data-i18n="fLong">Long-press off-timer (s, 0 = off)</span><input id="fLong" type="number" min="0" step="1" value="0" />
      <small class="hint" data-i18n="hintLong"></small></label>
    <label class="check" id="rPre"><input id="fPre" type="checkbox" checked /> <span data-i18n="fPre">Prewarning flicker (30s before off)</span>
      <small class="hint" data-i18n="hintPre"></small></label>
    <label id="rTarget"><span data-i18n="fTarget">Target value 0–100 (for target logic)</span><input id="fTarget" type="number" min="0" max="100" value="100" />
      <small class="hint" data-i18n="hintTarget"></small></label>
    <div class="hint" id="eudNote" hidden></div>
    <label class="check"><input id="fActive" type="checkbox" checked /> <span data-i18n="fActive">Rule active</span></label>
    <div class="err" id="fErr"></div>
    <div class="row">
      <span class="spacer"></span>
      <button value="cancel" data-i18n="cancel">Cancel</button>
      <button id="save" class="primary" value="default" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
