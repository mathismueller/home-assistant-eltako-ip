name: Validate & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-component:
    name: Validate Integration & Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate HACS / Marketplace metadata
        uses: hacs/action/validate@main
        with:
          category: integration

  test-and-lint:
    name: Tests and Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync

      - name: Run static typecheck (ty)
        run: uv run ty check src/ tests/ scripts/

      - name: Run unit test suite (pytest)
        run: uv run pytest
